<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're on the List | Sibylhaus</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: #000000;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-family: "Bebas Neue", sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #ffffff;
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 2rem;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .nav a {
            color: #d0d0d0;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #ffffff;
        }

        .hero {
            background-color: #000000;
            padding: 6rem 2rem;
            text-align: center;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-family: "Bebas Neue", sans-serif;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .hero h2 {
            font-family: "Bebas Neue", sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 2rem;
            text-transform: uppercase;
            color: #666;
        }

        .hero p {
            font-size: 1rem;
            color: #d0d0d0;
            font-weight: 300;
            max-width: 400px;
            margin-bottom: 2.5rem;
        }

        .cta-button {
            display: inline-block;
            background-color: #fff;
            color: #000;
            padding: 1rem 2rem;
            font-family: "Inter", sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background-color: #ccc;
        }

        footer {
            background-color: #000000;
            text-align: center;
            padding: 2.5rem;
            border-top: 1px solid #333;
            font-size: 0.75rem;
            color: #999;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            header { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">SIBYLHAUS</a>
        <nav class="nav">
            <a href="/">HOME</a>
            <a href="https://sibylhaus.etsy.com">SHOP</a>
        </nav>
    </header>

    <div class="hero">
        <h1>YOU'RE ON THE LIST</h1>
        <h2>Welcome</h2>
        <p>Check your inbox soon for the perks and discounts we mentioned. Big things are coming your way.</p>
        <a href="https://sibylhaus.com" class="cta-button">Return to Homepage</a>
    </div>

    <footer>
        <p>&copy; 2026 SIBYLHAUS. PRIVATE READING FOR JOY.</p>
    </footer>
</body>
</html>
